<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" fill="none">
  <rect width="600" height="400" fill="#0f172a"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.15" stroke="#334155" stroke-width="1">
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
  </g>

  <!-- Dashed Inner Frame -->
  <rect x="60" y="50" width="480" height="300" rx="16" stroke="#334155" stroke-width="2" stroke-dasharray="8 8" fill="#1e293b" fill-opacity="0.4"/>

  <!-- Image / Upload Icon -->
  <g transform="translate(300, 170)" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Camera/Image Outline -->
    <rect x="-36" y="-30" width="72" height="56" rx="8" fill="#0f172a" fill-opacity="0.6"/>
    <!-- Sun -->
    <circle cx="-16" cy="-12" r="5" fill="#94a3b8"/>
    <!-- Mountain Peaks -->
    <path d="M-30 18 L-8 -6 L12 14 L20 6 L30 18 Z" fill="#334155"/>
  </g>

  <!-- Typography Labels -->
  <text x="300" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#f1f5f9" text-anchor="middle" letter-spacing="0.3">
    Upload Image Here
  </text>
  <text x="300" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="middle">
    Customize in Admin Settings → Showcase Banner
  </text>
</svg>
