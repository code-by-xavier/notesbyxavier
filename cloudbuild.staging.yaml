# File: cloudbuild.staging.yaml
# ============================================================
# Notesby — Staging Cloud Build Pipeline
# Deploys Notesby to Google Cloud Run using Supabase for DB.
#
# No Cloud SQL sidecar required — Supabase uses a direct TLS
# TCP connection via the standard postgresql:// URL.
#
# REQUIRED: Override these substitutions in your Cloud Build
# trigger configuration. Never commit personal values here.
#
# Secret Manager naming convention: STAGING_<SECRET_NAME>
#   STAGING_DATABASE_URL    — your Supabase postgres:// connection string
#   STAGING_SESSION_SECRET  — random 32-byte hex
#   STAGING_GCS_BUCKET_NAME — your GCS staging bucket name (or same as prod)
# ============================================================
options:
  logging: CLOUD_LOGGING_ONLY
timeout: '1800s'

substitutions:
  _ENV: 'STAGING'
  _REGION: 'US-CENTRAL1'
  _SERVICE_NAME: 'MY-NOTESBY-STAGING'

steps:
  # Step 1: Build the staging container image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Image'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'
      - '.'

  # Step 2: Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Image'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}'
      - '--all-tags'
    waitFor: ['Build Image']

  # Step 3: Deploy to Cloud Run (Staging — Supabase, no Cloud SQL proxy)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy to Cloud Run'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$BUILD_ID'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=2'
      # Secrets injected from Secret Manager with STAGING_ prefix
      # DATABASE_URL resolves to Supabase postgres:// connection string
      - '--update-secrets=DATABASE_URL=${_ENV}_DATABASE_URL:latest,SESSION_SECRET=${_ENV}_SESSION_SECRET:latest,GCS_BUCKET_NAME=${_ENV}_GCS_BUCKET_NAME:latest'
      - '--set-env-vars=NODE_ENV=production,HOST=0.0.0.0'
    waitFor: ['Push Image']

  # Step 4: Print staging URL
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Print URL'
    entrypoint: bash
    args:
      - '-c'
      - |
        SERVICE_URL=$(gcloud run services describe ${_SERVICE_NAME} \
          --region=${_REGION} \
          --format="value(status.url)")
        echo ""
        echo "╔══════════════════════════════════════════════════╗"
        echo "║  🧪  Notesby deployed to STAGING!                ║"
        echo "╚══════════════════════════════════════════════════╝"
        echo ""
        echo "  Staging URL  : $${SERVICE_URL}"
        echo "  Setup Wizard : $${SERVICE_URL}/setup"
        echo "  DB Backend   : Supabase (STAGING_DATABASE_URL)"
        echo ""
    waitFor: ['Deploy to Cloud Run']

images:
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'
