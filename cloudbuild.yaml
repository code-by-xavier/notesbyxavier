steps:
  # 1. Build the multi-stage container
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'
      - '.'

  # 2. Push image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'

  # 3. Deploy to Cloud Run with Secret Manager secrets + Cloud SQL
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=3'
      # Inject secrets from Secret Manager as environment variables
      - '--update-secrets=DATABASE_URL=notesby-database-url:latest,SESSION_SECRET=notesby-session-secret:latest,GCS_BUCKET_NAME=notesby-gcs-bucket:latest'
      # Connect to Cloud SQL via the sidecar proxy
      - '--add-cloudsql-instances=$PROJECT_ID:${_REGION}:${_DB_INSTANCE}'
      - '--set-env-vars=NODE_ENV=production,HOST=0.0.0.0,PORT=8080'

  # 4. Print the live setup wizard URL
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        SERVICE_URL=$(gcloud run services describe ${_SERVICE_NAME} \
          --region=${_REGION} \
          --format="value(status.url)")
        echo ""
        echo "╔══════════════════════════════════════════════════╗"
        echo "║  🚀  Notesby deployed successfully!              ║"
        echo "╚══════════════════════════════════════════════════╝"
        echo ""
        echo "  Publication URL : $${SERVICE_URL}"
        echo "  Setup Wizard    : $${SERVICE_URL}/setup"
        echo ""

substitutions:
  _SERVICE_NAME: 'notesbyxavier'
  _REGION: 'us-central1'
  _DB_INSTANCE: 'notesbyxavier-db'

images:
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'
